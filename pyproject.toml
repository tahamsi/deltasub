[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deltasub"
version = "0.1.0"
description = "Counterfactual value-of-subdivision routing research scaffold"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "pyarrow>=15",
  "PyYAML>=6",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
data = ["torchvision>=0.18", "Pillow>=10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "gpu: requires a CUDA device",
  "a100: requires one NVIDIA A100",
  "integration: requires an explicitly supplied local upstream source or fixture",
]
